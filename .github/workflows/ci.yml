name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # The golden replay must hash identically on every OS and CPU.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # net10.0 runs SimRun and the tests; the SDK also builds the
          # library's net8.0 target from its reference pack.
          dotnet-version: 10.0.x
      - run: dotnet test SimCore.sln
