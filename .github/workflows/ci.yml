name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # The golden replay must hash identically on every OS and CPU.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Test on 32-bit x86
        if: matrix.os == 'ubuntu-latest'
        run: GOARCH=386 go test -count=1 ./...
